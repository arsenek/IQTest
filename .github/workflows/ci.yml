name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bank-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: npm ci
      - name: Rule-gen uniqueness checks (pri/vci/psi/wmi)
        run: npm run bank:check
      - name: Unit tests (includes uniqueness breakage regressions)
        run: npm test
